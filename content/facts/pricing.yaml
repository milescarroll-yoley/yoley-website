# Pricing facts — single source of truth for every rate, fee, and plan price
# mentioned on the website, the guides, and the in-app KB.
#
# Changing a number here regenerates it on every surface via the
# <!-- FACT:pricing.<path> -->…<!-- /FACT --> marker substitution.
#
# Keep values short — they're substituted inline. For metadata / description
# sentences that embed a rate inside a fuller phrase, prefer rewriting the
# phrase to place the rate in a fact marker rather than recomposing the whole
# sentence from parts.

#
# Model as of 10 Sep 2026: the app is free — no subscription, no Pro tier, no
# trial, no in-app purchases. Card payments run through the merchant's own
# Monek Processing Account (price pack "Yoley1"): 0.99% personal cards,
# 1.99% business cards, 2.99% foreign-issued cards, plus 5p per transaction.
# No application fee, no monthly fee, charged only on successful payments.
# Settlement is T+2 (decided 7 Sep 2026).

app:
  price: "£0"
  plan_cost: "free forever"          # "Free forever, no card required"
  invoices: "unlimited"

card:
  rate: "0.99%"                      # personal (consumer) cards — the headline rate
  headline: "0.99% + 5p"             # "Card payments from 0.99% + 5p"
  business_rate: "1.99%"             # commercial / business cards
  foreign_rate: "2.99%"              # foreign-issued cards
  per_txn: "5p"                      # covers the payment link and chase messages
  provider: "Monek"

settlement:
  days: "two working days"           # T+2 — "paid out two working days after the payment"
  provider: "Monek"
